<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — StyleNotes AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="ruled-bg" style="min-height: 100vh;">

<div class="container">
  <nav class="nav">
    <a href="index.html" class="logo">
      <span class="logo-mark"></span>
      StyleNotes AI
    </a>
  </nav>
</div>

<div style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
  <div class="card">
    <h1 style="font-size: 1.7rem;">Welcome back</h1>
    <p class="text-soft" style="font-size: 0.92rem; margin-top: 6px; margin-bottom: 24px;">
      Log in to generate notes in your style.
    </p>

    <div id="errorBox" class="error-box hidden"></div>

    <form onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@college.edu">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Your password">
      </div>
      <button type="submit" id="submitBtn" class="btn btn-accent btn-block">Log in →</button>
    </form>

    <p class="text-soft" style="text-align: center; margin-top: 18px; font-size: 0.9rem;">
      New here? <a href="register.html" style="color: var(--ink); font-weight: 600;">Create an account</a>
    </p>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
